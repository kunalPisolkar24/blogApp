services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: ${QDRANT_CONTAINER:-local-qdrant}
    restart: unless-stopped
    ports:
      - "${QDRANT_EXT_PORT:-6333}:${QDRANT_INT_PORT:-6333}"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/${QDRANT_INT_PORT:-6333}'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  embedding-service:
    image: ollama/ollama:latest
    container_name: ${EMBEDDING_CONTAINER:-local-embedding-service}
    restart: unless-stopped
    ports:
      - "${EMBEDDING_EXT_PORT:-11434}:${EMBEDDING_INT_PORT:-11434}"
    volumes:
      - embedding_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  embedding-model-init:
    image: ollama/ollama:latest
    container_name: ${EMBEDDING_MODEL_INIT_CONTAINER:-local-embedding-model-init}
    restart: "no"
    depends_on:
      embedding-service:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command: "ollama serve >/dev/null 2>&1 & sleep 3; ollama pull ${EMBEDDING_MODEL:-snowflake-arctic-embed2:568m}; wait"
    volumes:
      - embedding_data:/root/.ollama
    networks:
      - app-network

  ai-postgres:
    image: postgres:16-alpine
    container_name: ${AI_POSTGRES_CONTAINER:-local-ai-postgres}
    restart: unless-stopped
    ports:
      - "${AI_POSTGRES_EXT_PORT:-5433}:5432"
    environment:
      - POSTGRES_USER=${AI_POSTGRES_USER:-ai_checkpointer}
      - POSTGRES_PASSWORD=${AI_POSTGRES_PASSWORD:-ai_checkpointer_pass}
      - POSTGRES_DB=${AI_POSTGRES_DB:-ai_checkpoints}
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AI_POSTGRES_USER:-ai_checkpointer} -d ${AI_POSTGRES_DB:-ai_checkpoints}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${AI_SERVICE_CONTAINER:-local-ai-service}
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_EXT_PORT:-50051}:${AI_SERVICE_INT_PORT:-50051}"
      - "${AI_METRICS_EXT_PORT:-12666}:${AI_METRICS_INT_PORT:-12666}"
    environment:
      - PORT=${AI_SERVICE_INT_PORT:-50051}
      - METRICS_PORT=${AI_METRICS_INT_PORT:-12666}
      - LOG_LEVEL=${AI_LOG_LEVEL:-INFO}
      - LLM_API_URL=${AI_LLM_API_URL:-https://lightning.ai/api/v1/chat/completions}
      - LLM_API_KEY=${LIGHTNING_AI_API_KEY:-}
      - LLM_MODEL=${AI_LIGHTNING_MODEL:-lightning-ai/gpt-oss-20b}
      - LLM_MODE=${AI_LLM_MODE:-fake}
      - LLM_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-60}
      - CHECKPOINT_DB_URL=${AI_CHECKPOINT_DB_URL:-postgresql://ai_checkpointer:ai_checkpointer_pass@ai-postgres:5432/ai_checkpoints}
      - QDRANT_URL=${AI_QDRANT_URL:-http://qdrant:6333}
      - QDRANT_API_KEY=${AI_QDRANT_API_KEY:-}
      - QDRANT_VECTOR_SIZE=${AI_QDRANT_VECTOR_SIZE:-1024}
      - SEARCH_DENSE_SCORE_THRESHOLD=${AI_SEARCH_DENSE_SCORE_THRESHOLD:-0.3}
      - EMBEDDING_MODE=${AI_EMBEDDING_MODE:-ollama}
      - EMBEDDING_URL=${AI_EMBEDDING_URL:-http://embedding-service:11434}
      - EMBEDDING_MODEL=${AI_EMBEDDING_MODEL:-snowflake-arctic-embed2:568m}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${AI_OTLP_ENDPOINT:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import grpc, os, sys
          from grpc_health.v1 import health_pb2, health_pb2_grpc
          channel = grpc.insecure_channel(f"127.0.0.1:{os.environ['PORT']}")
          status = health_pb2_grpc.HealthStub(channel).Check(
              health_pb2.HealthCheckRequest(service="ai.AIService"), timeout=5
          ).status
          sys.exit(0 if status == health_pb2.HealthCheckResponse.SERVING else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      qdrant:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
      embedding-model-init:
        condition: service_completed_successfully
      ai-postgres:
        condition: service_healthy
    networks:
      - app-network

volumes:
  qdrant_data:
  embedding_data:
  ai_postgres_data:

networks:
  app-network:
    name: ${APP_NETWORK:-topos_local_network}
    driver: bridge
