syntax = "proto3";

package ai;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/kunalPisolkar24/topos/services/content/proto/ai";

service AIService {
  rpc GenerateSummary (ContentRequest) returns (ContentResponse);
  rpc GenerateTags (ContextRequest) returns (TagsResponse);
  rpc GeneratePost (PostGenerationRequest) returns (PostGenerationResponse);
  rpc GeneratePostDraft (PostGenerationRequest) returns (PostWorkflowState);
  rpc ApprovePost (ApprovePostRequest) returns (PostWorkflowState);
  rpc RejectPost (RejectPostRequest) returns (PostWorkflowState);
  rpc IndexPost (IndexRequest) returns (IndexResponse);
  rpc DeletePost (DeleteRequest) returns (DeleteResponse);
  rpc SearchPosts (SearchRequest) returns (SearchResponse);
  rpc RelatedPosts (RelatedRequest) returns (RelatedResponse);
  rpc RelatedPostsBatch (RelatedBatchRequest) returns (RelatedBatchResponse);
  rpc Embed (EmbedRequest) returns (EmbedResponse);
  rpc ChatAnswer (ChatAnswerRequest) returns (stream ChatChunk);
  rpc UpdateUserProfile (UserProfileUpdateRequest) returns (UserProfileUpdateResponse);
  rpc RecommendFeed (RecommendRequest) returns (RecommendResponse);
  rpc DeleteUserProfile (DeleteUserProfileRequest) returns (DeleteUserProfileResponse);
}

message ContentRequest {
  string text = 1;
}

message ContentResponse {
  string summary = 1;
}

message ContextRequest {
  string title = 1;
  string body = 2;
}

message TagsResponse {
  repeated string tags = 1;
}

message PostGenerationRequest {
  string prompt = 1;
}

message PostGenerationResponse {
  string title = 1;
  string body = 2;
  string summary = 3;
  repeated string tags = 4;
}

// WorkflowStatus is the lifecycle state of a human-in-the-loop post
// generation workflow.
enum WorkflowStatus {
  WORKFLOW_STATUS_UNSPECIFIED = 0;
  // Generated and paused for review.
  WORKFLOW_STATUS_PENDING = 1;
  // Approved; the final post payload is populated.
  WORKFLOW_STATUS_APPROVED = 2;
  // Rejected by a reviewer. The workflow stays resumable, so approval
  // can still happen later.
  WORKFLOW_STATUS_REJECTED = 3;
}

// PostWorkflowState is the shared response for the draft workflow RPCs:
// GeneratePostDraft returns it paused at pending, ApprovePost resumes
// it to approved with the final payload, RejectPost marks it rejected.
message PostWorkflowState {
  string title = 1;
  string body = 2;
  string summary = 3;
  repeated string tags = 4;
  // approval_id identifies this workflow; pass it back to ApprovePost
  // or RejectPost to resume or reject it.
  string approval_id = 5;
  WorkflowStatus status = 6;
}

message ApprovePostRequest {
  // approval_id returned by GeneratePostDraft.
  string approval_id = 1;
  // Optional edits applied before the workflow resumes: unset fields
  // keep the generated value, a non-empty tags list replaces the
  // generated tags.
  optional string title = 2;
  optional string body = 3;
  optional string summary = 4;
  repeated string tags = 5;
}

message RejectPostRequest {
  // approval_id returned by GeneratePostDraft.
  string approval_id = 1;
  // Optional reviewer-facing reason recorded with the rejection.
  string reason = 2;
}

message IndexRequest {
  string post_id = 1;
  string title = 2;
  string body = 3;
  string summary = 4;
  repeated string tags = 5;
  // created_at is the post's creation time, UTC. It is carried as a
  // typed timestamp so consumers never have to guess a string format.
  google.protobuf.Timestamp created_at = 6;
}

message IndexResponse {}

message DeleteRequest {
  string post_id = 1;
}

message DeleteResponse {}

message SearchRequest {
  string query = 1;
  uint32 offset = 2;
  uint32 limit = 3;
}

message SearchResponse {
  repeated string post_ids = 1;
  int32 total = 2;
}

message RelatedRequest {
  string post_id = 1;
  uint32 limit = 2;
}

message RelatedResponse {
  repeated string post_ids = 1;
  // total is the number of indexed posts available as related
  // candidates, not the size of this page.
  int32 total = 2;
}

message RelatedBatchRequest {
  repeated string post_ids = 1;
  uint32 limit = 2;
}

message RelatedBatchItem {
  string post_id = 1;
  repeated string related_post_ids = 2;
  int32 total = 3;
}

message RelatedBatchResponse {
  repeated RelatedBatchItem results = 1;
}

message EmbedRequest {
  string text = 1;
}

message EmbedResponse {
  repeated float vector = 1;
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message ChatAnswerRequest {
  string query = 1;
  repeated ChatMessage history = 2;
  uint32 top_k = 3;
  // thread_id groups a conversation for checkpointed sessions. Empty
  // keeps the request stateless.
  string thread_id = 4;
}

message ChatChunk {
  string delta = 1;
  bool done = 2;
  repeated string cited_post_ids = 3;
  string error = 4;
}

// InteractionKind is the type of a user interaction with a post that
// shapes the user's interest profile.
enum InteractionKind {
  INTERACTION_KIND_UNSPECIFIED = 0;
  INTERACTION_KIND_VIEW = 1;
  INTERACTION_KIND_LIKE = 2;
  INTERACTION_KIND_SAVE = 3;
}

// RecommendMode selects how a feed is ranked for a user: DEFAULT follows
// the user's learned taste, SURPRISE deliberately strays from it, FRESH
// narrows the window to recent posts, EXPLORER blends surprise pages
// into the default ranking.
enum RecommendMode {
  RECOMMEND_MODE_UNSPECIFIED = 0;
  RECOMMEND_MODE_DEFAULT = 1;
  RECOMMEND_MODE_SURPRISE = 2;
  RECOMMEND_MODE_FRESH = 3;
  RECOMMEND_MODE_EXPLORER = 4;
}

message UserProfileUpdateRequest {
  string user_id = 1;
  string post_id = 2;
  InteractionKind kind = 3;
}

message UserProfileUpdateResponse {}

message RecommendRequest {
  string user_id = 1;
  uint32 offset = 2;
  uint32 limit = 3;
  RecommendMode mode = 4;
  // seed makes surprise ordering deterministic: the same seed and
  // profile always yield the same feed.
  uint32 seed = 5;
}

message RecommendResponse {
  repeated string post_ids = 1;
  // total is the number of rankable posts for the user, not the size of
  // this page.
  int32 total = 2;
  // reasons maps post_id -> evidence line derived from the user's real
  // interaction profile; posts without usable evidence are absent.
  map<string, string> reasons = 3;
}

message DeleteUserProfileRequest {
  string user_id = 1;
}

message DeleteUserProfileResponse {}
