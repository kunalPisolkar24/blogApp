name: topos-ai-loadtest

x-ai-service-env: &ai-service-env
  PORT: 50051
  LLM_MODE: ${LLM_MODE:-fake}
  LLM_API_KEY: ${LLM_API_KEY:-}
  EMBEDDING_MODE: ${EMBEDDING_MODE:-fake}
  EMBEDDING_URL: http://ollama:11434
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-snowflake-arctic-embed2:568m}
  VECTOR_MODE: ${VECTOR_MODE:-qdrant}
  QDRANT_URL: http://qdrant:6333
  LOG_LEVEL: ${LOG_LEVEL:-WARNING}
  METRICS_PORT: 12666

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: loadtest-ai-qdrant
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - loadtest-net
    deploy:
      resources:
        limits:
          memory: ${QDRANT_MEM:-256M}
        reservations:
          memory: 64M

  # Only started for embedding-real runs (EMBEDDING_MODE=ollama); fake
  # runs never pull the model. The entrypoint serves the API and pulls
  # the configured model before the healthcheck can pass. Startup order
  # is handled by the Makefile (ai-service waits for ollama via health).
  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-0.9.6}
    container_name: loadtest-ai-ollama
    restart: unless-stopped
    profiles:
      - embedding-real
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3; ollama pull $$OLLAMA_MODEL; wait"]
    environment:
      OLLAMA_MODEL: ${EMBEDDING_MODEL:-snowflake-arctic-embed2:568m}
    healthcheck:
      test: ["CMD", "ollama", "show", "${EMBEDDING_MODEL:-snowflake-arctic-embed2:568m}"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - loadtest-net
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEM:-2G}
        reservations:
          memory: 512M

  ai-service:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: loadtest-ai-service
    restart: unless-stopped
    environment: *ai-service-env
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/healthcheck.py"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    volumes:
      - ./healthcheck.py:/healthcheck.py:ro
    networks:
      - loadtest-net
    deploy:
      resources:
        limits:
          memory: ${SVC_MEM:-512M}
        reservations:
          memory: 128M

  k6:
    image: grafana/k6:latest
    container_name: loadtest-k6
    restart: "no"
    command: ["run", "--summary-trend-stats=avg,med,p(90),p(95),p(99),max", "/load-tests/k6/${SCRIPT:-mixed}.js"]
    environment:
      TARGET: ai-service:50051
      VUS: ${VUS:-20}
      DURATION: ${DURATION:-30s}
      RPS: ${RPS:-100}
      WEIGHTS: ${WEIGHTS:-summary:40,tags:30,post:30}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-fake}
      SEARCH_P95: ${SEARCH_P95:-250}
      SEARCH_P99: ${SEARCH_P99:-600}
      RECOMMEND_P95: ${RECOMMEND_P95:-250}
      RECOMMEND_P99: ${RECOMMEND_P99:-600}
      CHAT_P95: ${CHAT_P95:-500}
      CHAT_P99: ${CHAT_P99:-1500}
    depends_on:
      ai-service:
        condition: service_healthy
    volumes:
      - ./k6:/load-tests/k6:ro
      - ../proto:/proto:ro
    networks:
      - loadtest-net
    deploy:
      resources:
        limits:
          memory: ${K6_MEM:-384M}
        reservations:
          memory: 64M

networks:
  loadtest-net:
    name: ai-loadtest-net
    driver: bridge

volumes:
  ollama-models:
