[project]
name = "ai-service"
version = "0.1.0"
description = "AI Intelligence Service"
authors = [
    {name = "Kunal Pisolkar",email = "55585892+kunalPisolkar24@users.noreply.github.com"}
]
requires-python = ">=3.12"
dependencies = [
    "grpcio (>=1.83.0,<2.0.0)",
    "grpcio-health-checking (>=1.83.0,<2.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "python-json-logger (>=4.1.0,<5.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "bleach (>=6.4.0,<7.0.0)",
    "prometheus-client (>=0.26.0,<0.27.0)",
    "opentelemetry-sdk (>=1.30,<2.0)",
    "opentelemetry-exporter-otlp (>=1.30,<2.0)",
    "opentelemetry-instrumentation-grpc (>=0.51,<1.0)",
    "opentelemetry-instrumentation-httpx (>=0.51,<1.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "grpcio-tools (>=1.83.0,<2.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
exclude = ["src/generated"]

[tool.coverage.run]
omit = ["src/generated/*"]
