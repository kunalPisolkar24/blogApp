include:
  - path: infra/postgres.yml
  - path: infra/redis.yml

services:
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${USER_SERVICE_CONTAINER:?USER_SERVICE_CONTAINER is required}
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_EXT_PORT:?USER_SERVICE_EXT_PORT is required}:${USER_SERVICE_INT_PORT:?USER_SERVICE_INT_PORT is required}"
    environment:
      - NODE_ENV=production
      - PORT=${USER_SERVICE_INT_PORT:?USER_SERVICE_INT_PORT is required}
      - DATABASE_URL=${USER_DATABASE_URL:?USER_DATABASE_URL is required}
      - DATABASE_URL_REPLICA=${USER_DATABASE_URL_REPLICA:?USER_DATABASE_URL_REPLICA is required}
      - DATABASE_URL_MIGRATE=${USER_DATABASE_URL_MIGRATE:-${USER_DATABASE_URL:?USER_DATABASE_URL is required}}
      - JWT_SECRET=${USER_JWT_SECRET:?USER_JWT_SECRET is required}
      - JWT_ISSUER=${USER_JWT_ISSUER:-user-service}
      - JWT_AUDIENCE=${USER_JWT_AUDIENCE:-topos}
      - JWT_EXPIRES_IN=${USER_JWT_EXPIRES_IN:-7d}
      - REDIS_SENTINELS=${USER_REDIS_SENTINEL_HOSTS:?USER_REDIS_SENTINEL_HOSTS is required}
      - REDIS_SENTINEL_NAME=${USER_REDIS_MASTER_NAME:-mymaster}
      - REDIS_PASSWORD=${USER_REDIS_PASSWORD:?USER_REDIS_PASSWORD is required}
      - REDIS_SENTINEL_PASSWORD=${USER_REDIS_SENTINEL_PASSWORD:?USER_REDIS_SENTINEL_PASSWORD is required}
      - REDIS_CACHE_TTL_MS=${USER_CACHE_TTL_MS:-3600000}
      - REDIS_MISSING_CACHE_TTL_MS=${USER_MISSING_CACHE_TTL_MS:-60000}
      - LOG_LEVEL=${USER_LOG_LEVEL:-info}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${USER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=user-service
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${USER_SERVICE_INT_PORT:?USER_SERVICE_INT_PORT is required}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      user-postgres-pool:
        condition: service_healthy
      user-redis-sentinel-1:
        condition: service_healthy
      user-redis-sentinel-2:
        condition: service_healthy
      user-redis-sentinel-3:
        condition: service_healthy
      user-migrator:
        condition: service_completed_successfully
    networks:
      - app-network

  user-migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    container_name: ${USER_MIGRATOR_CONTAINER:?USER_MIGRATOR_CONTAINER is required}
    environment:
      - DATABASE_URL_MIGRATE=${USER_DATABASE_URL_MIGRATE:-${USER_DATABASE_URL:?USER_DATABASE_URL is required}}
    depends_on:
      user-postgres-pool:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: ${APP_NETWORK}