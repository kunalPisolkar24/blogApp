x-redis-common: &redis-common
  image: bitnami/redis:latest
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    - app-network
  deploy:
    resources:
      limits:
        memory: 256M
      reservations:
        memory: 128M

x-sentinel-common: &sentinel-common
  image: bitnami/redis-sentinel:latest
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -p 26379 -a \"$$REDIS_SENTINEL_PASSWORD\" ping | grep -q PONG"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    - app-network
  depends_on:
    user-redis-master:
      condition: service_healthy
    user-redis-replica-1:
      condition: service_healthy
    user-redis-replica-2:
      condition: service_healthy
  deploy:
    resources:
      limits:
        memory: 256M
      reservations:
        memory: 128M

services:
  user-redis-master:
    <<: *redis-common
    container_name: ${USER_REDIS_MASTER_CONTAINER:?USER_REDIS_MASTER_CONTAINER is required}
    environment:
      - REDIS_REPLICATION_MODE=master
      - REDIS_PASSWORD=${USER_REDIS_PASSWORD:?USER_REDIS_PASSWORD is required}
      - REDIS_AOF_ENABLED=yes
    volumes:
      - user_redis_master_data:/bitnami/redis

  user-redis-replica-1:
    <<: *redis-common
    container_name: ${USER_REDIS_REPLICA_1_CONTAINER:?USER_REDIS_REPLICA_1_CONTAINER is required}
    environment:
      - REDIS_REPLICATION_MODE=replica
      - REDIS_MASTER_HOST=${USER_REDIS_MASTER_CONTAINER:?USER_REDIS_MASTER_CONTAINER is required}
      - REDIS_MASTER_PORT_NUMBER=6379
      - REDIS_MASTER_PASSWORD=${USER_REDIS_PASSWORD:?USER_REDIS_PASSWORD is required}
      - REDIS_PASSWORD=${USER_REDIS_PASSWORD:?USER_REDIS_PASSWORD is required}
      - REDIS_AOF_ENABLED=yes
    volumes:
      - user_redis_replica_1_data:/bitnami/redis
    depends_on:
      user-redis-master:
        condition: service_healthy

  user-redis-replica-2:
    <<: *redis-common
    container_name: ${USER_REDIS_REPLICA_2_CONTAINER:?USER_REDIS_REPLICA_2_CONTAINER is required}
    environment:
      - REDIS_REPLICATION_MODE=replica
      - REDIS_MASTER_HOST=${USER_REDIS_MASTER_CONTAINER:?USER_REDIS_MASTER_CONTAINER is required}
      - REDIS_MASTER_PORT_NUMBER=6379
      - REDIS_MASTER_PASSWORD=${USER_REDIS_PASSWORD:?USER_REDIS_PASSWORD is required}
      - REDIS_PASSWORD=${USER_REDIS_PASSWORD:?USER_REDIS_PASSWORD is required}
      - REDIS_AOF_ENABLED=yes
    volumes:
      - user_redis_replica_2_data:/bitnami/redis
    depends_on:
      user-redis-master:
        condition: service_healthy

  user-redis-sentinel-1:
    <<: *sentinel-common
    container_name: ${USER_REDIS_SENTINEL_1_CONTAINER:?USER_REDIS_SENTINEL_1_CONTAINER is required}
    environment: &sentinel-env
      REDIS_MASTER_HOST: ${USER_REDIS_MASTER_CONTAINER:?USER_REDIS_MASTER_CONTAINER is required}
      REDIS_MASTER_PORT_NUMBER: 6379
      REDIS_MASTER_SET: ${USER_REDIS_MASTER_NAME:-mymaster}
      REDIS_SENTINEL_QUORUM: 2
      REDIS_SENTINEL_ANNOUNCE_HOSTNAMES: "yes"
      REDIS_SENTINEL_RESOLVE_HOSTNAMES: "yes"
      REDIS_MASTER_PASSWORD: ${USER_REDIS_PASSWORD:?USER_REDIS_PASSWORD is required}
      REDIS_SENTINEL_PASSWORD: ${USER_REDIS_SENTINEL_PASSWORD:?USER_REDIS_SENTINEL_PASSWORD is required}

  user-redis-sentinel-2:
    <<: *sentinel-common
    container_name: ${USER_REDIS_SENTINEL_2_CONTAINER:?USER_REDIS_SENTINEL_2_CONTAINER is required}
    environment:
      <<: *sentinel-env

  user-redis-sentinel-3:
    <<: *sentinel-common
    container_name: ${USER_REDIS_SENTINEL_3_CONTAINER:?USER_REDIS_SENTINEL_3_CONTAINER is required}
    environment:
      <<: *sentinel-env

volumes:
  user_redis_master_data:
  user_redis_replica_1_data:
  user_redis_replica_2_data:

networks:
  app-network:
    external: true
    name: ${APP_NETWORK}
