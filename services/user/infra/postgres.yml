x-postgres-common: &postgres-common
  image: bitnami/postgresql:latest
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRESQL_USERNAME\" -d \"$$POSTGRESQL_DATABASE\""]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s
  networks:
    - app-network
  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 256M

services:
  user-postgres-primary:
    <<: *postgres-common
    container_name: ${USER_POSTGRES_PRIMARY_CONTAINER:?USER_POSTGRES_PRIMARY_CONTAINER is required}
    ports:
      - "${USER_POSTGRES_EXT_PORT:?USER_POSTGRES_EXT_PORT is required}:${USER_POSTGRES_INT_PORT:-5432}"
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=${USER_POSTGRES_REPLICATION_USER:?USER_POSTGRES_REPLICATION_USER is required}
      - POSTGRESQL_REPLICATION_PASSWORD=${USER_POSTGRES_REPLICATION_PASSWORD:?USER_POSTGRES_REPLICATION_PASSWORD is required}
      - POSTGRESQL_USERNAME=${USER_POSTGRES_USER:?USER_POSTGRES_USER is required}
      - POSTGRESQL_PASSWORD=${USER_POSTGRES_PASSWORD:?USER_POSTGRES_PASSWORD is required}
      - POSTGRESQL_DATABASE=${USER_POSTGRES_DB:?USER_POSTGRES_DB is required}
    volumes:
      - user_postgres_primary_data:/bitnami/postgresql

  user-postgres-replica-1:
    <<: *postgres-common
    container_name: ${USER_POSTGRES_REPLICA_1_CONTAINER:?USER_POSTGRES_REPLICA_1_CONTAINER is required}
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_MASTER_HOST=${USER_POSTGRES_PRIMARY_CONTAINER:?USER_POSTGRES_PRIMARY_CONTAINER is required}
      - POSTGRESQL_MASTER_PORT_NUMBER=${USER_POSTGRES_INT_PORT:-5432}
      - POSTGRESQL_REPLICATION_USER=${USER_POSTGRES_REPLICATION_USER:?USER_POSTGRES_REPLICATION_USER is required}
      - POSTGRESQL_REPLICATION_PASSWORD=${USER_POSTGRES_REPLICATION_PASSWORD:?USER_POSTGRES_REPLICATION_PASSWORD is required}
      - POSTGRESQL_USERNAME=${USER_POSTGRES_USER:?USER_POSTGRES_USER is required}
      - POSTGRESQL_PASSWORD=${USER_POSTGRES_PASSWORD:?USER_POSTGRES_PASSWORD is required}
      - POSTGRESQL_DATABASE=${USER_POSTGRES_DB:?USER_POSTGRES_DB is required}
    volumes:
      - user_postgres_replica_1_data:/bitnami/postgresql
    depends_on:
      user-postgres-primary:
        condition: service_healthy

  user-postgres-replica-2:
    <<: *postgres-common
    container_name: ${USER_POSTGRES_REPLICA_2_CONTAINER:?USER_POSTGRES_REPLICA_2_CONTAINER is required}
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_MASTER_HOST=${USER_POSTGRES_PRIMARY_CONTAINER:?USER_POSTGRES_PRIMARY_CONTAINER is required}
      - POSTGRESQL_MASTER_PORT_NUMBER=${USER_POSTGRES_INT_PORT:-5432}
      - POSTGRESQL_REPLICATION_USER=${USER_POSTGRES_REPLICATION_USER:?USER_POSTGRES_REPLICATION_USER is required}
      - POSTGRESQL_REPLICATION_PASSWORD=${USER_POSTGRES_REPLICATION_PASSWORD:?USER_POSTGRES_REPLICATION_PASSWORD is required}
      - POSTGRESQL_USERNAME=${USER_POSTGRES_USER:?USER_POSTGRES_USER is required}
      - POSTGRESQL_PASSWORD=${USER_POSTGRES_PASSWORD:?USER_POSTGRES_PASSWORD is required}
      - POSTGRESQL_DATABASE=${USER_POSTGRES_DB:?USER_POSTGRES_DB is required}
    volumes:
      - user_postgres_replica_2_data:/bitnami/postgresql
    depends_on:
      user-postgres-primary:
        condition: service_healthy

volumes:
  user_postgres_primary_data:
  user_postgres_replica_1_data:
  user_postgres_replica_2_data:

networks:
  app-network:
    external: true
    name: ${APP_NETWORK}
