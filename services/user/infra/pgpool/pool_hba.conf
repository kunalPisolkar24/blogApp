# =============================================================================
# Pgpool-II client authentication (enabled via enable_pool_hba = on)
# =============================================================================
# The pool publishes no host ports — only containers on the same compose
# network can reach it — so a private-range rule is sufficient. App services
# and the pool healthcheck authenticate with SCRAM against pool_passwd.
#
# Host rules are evaluated top-down, first match wins.

host    all    all        127.0.0.1/32    scram-sha-256
host    all    all        0.0.0.0/0       scram-sha-256
