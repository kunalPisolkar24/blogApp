# =============================================================================
# Pgpool-II — HA front for the user service Postgres tripod
# =============================================================================
# Mounted read-only into the pool container at /config and copied verbatim to
# /opt/pgpool-II/etc/pgpool.conf by the container entrypoint.
#
# Targets Pgpool-II 4.7.x (required for PostgreSQL 18).
# NOTE: master_slave_mode / master_slave_sub_mode were removed; the modern key
# is backend_clustering_mode = 'streaming_replication'.
#
# Backend hostnames are COMPOSE SERVICE NAMES (stable DNS on the compose
# network), not container names, so this file works unchanged in both the
# prod and the ha-test compose stacks.

# --- Listeners ----------------------------------------------------------------
# Port 5432 matches the standard Postgres port, so the pool transparently
# replaces the database endpoint (the app's DATABASE_URL is unchanged).
listen_addresses = '*'
port = 5432
socket_dir = '/var/run/pgpool'

# --- Pool size ----------------------------------------------------------------
num_init_children = 32
max_pool = 4

# --- Backends (the Postgres tripod) -------------------------------------------
backend_clustering_mode = 'streaming_replication'
load_balance_mode = on

backend_hostname0 = 'user-postgres-primary'
backend_port0 = 5432
backend_weight0 = 1
backend_flag0 = 'ALLOW_TO_FAILOVER'

backend_hostname1 = 'user-postgres-replica-1'
backend_port1 = 5432
backend_weight1 = 1
backend_flag1 = 'ALLOW_TO_FAILOVER'

backend_hostname2 = 'user-postgres-replica-2'
backend_port2 = 5432
backend_weight2 = 1
backend_flag2 = 'ALLOW_TO_FAILOVER'

# --- Client authentication ----------------------------------------------------
enable_pool_hba = on
pool_passwd = 'pool_passwd'
authentication_timeout = 60

# --- Health check (as superuser 'postgres') -----------------------------------
health_check_period = 5
health_check_timeout = 10
health_check_max_retries = 2
health_check_retry_delay = 2
health_check_user = 'postgres'

# --- Streaming replication check (as superuser 'postgres') --------------------
sr_check_period = 5
sr_check_user = 'postgres'
sr_check_password = ''

# --- Failover -----------------------------------------------------------------
# %d failed node id, %h failed host, %H new main host, %P old primary node id.
failover_command = '/config/failover.sh %d %h %H %P'
failover_on_backend_error = on
search_primary_node_timeout = 90
detach_false_primary = off

# --- PCP (admin) ---------------------------------------------------------------
pcp_listen_addresses = '*'
pcp_port = 9898
